name: "Submit to Web Store"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version taken from "packageManager" in package.json
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the extension (Chrome + Firefox)
        run: |
          pnpm build
          pnpm build:firefox
      - name: Package the extension into zip artifacts
        run: |
          pnpm package
          pnpm package:firefox
      - name: Zip source code (required by Firefox Add-ons review)
        run: git archive --format=zip -o build/source.zip HEAD
      - name: Browser Platform Publish
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          chrome-file: build/chrome-mv3-prod.zip
          firefox-file: build/firefox-mv3-prod.zip
          source-file: build/source.zip
